aid: autonomys
name: Autonomys
description: >-
  Autonomys is a decentralized infrastructure network providing permanent,
  verifiable, content-addressed data storage and AI-ready blockchain services,
  secured by a Proof-of-Archival-Storage consensus. Its developer surface
  centers on Auto Drive — permanent storage exposed through a REST API where
  objects are addressed by IPFS-style CIDs — and the Auto SDK, a TypeScript
  toolkit (@autonomys/* npm packages) for consensus, storage, cross-domain
  messaging, and DAG data. The broader stack adds Auto EVM (an Ethereum-
  compatible execution domain), Auto Agents (a framework for autonomous on-chain
  AI agents), and Auto ID (self-sovereign identity). Storage is paid in native
  AI3 via an on-chain Intents flow. Autonomys was surfaced as a portfolio
  company of Pantera Capital and has now been enriched from its public
  developer surface.
